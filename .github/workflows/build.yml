name: Build on Push (Non-Main Branches)

on:
  push:
    branches-ignore:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        os: [windows-latest, ubuntu-22.04]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Build Agent and Bot
        run: |
          pyinstaller --onefile --name=agent.exe agent/__main__.py || pyinstaller --onefile --name=agent agent/__main__.py
          pyinstaller --onefile --name=bot.exe bot/__main__.py || pyinstaller --onefile --name=bot bot/__main__.py

          - name: Create Archives
          run: |
            mkdir release
            cd dist
            # Проверим, что файл создан
            echo "Listing files in dist/ directory:"
            ls -l
        
            # На Windows
            if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
              powershell Compress-Archive -Path agent.exe -DestinationPath ../release/agent-windows-v${{ env.VERSION }}.zip
              powershell Compress-Archive -Path bot.exe -DestinationPath ../release/bot-windows-v${{ env.VERSION }}.zip
            else
              # На Linux проверяем, что файл существует перед упаковкой
              if [ -f "agent" ]; then
                  zip -r ../release/agent-linux-v${{ env.VERSION }}.zip agent
              else
                  echo "Error: agent file not found!"
                  exit 1
              fi
              
              if [ -f "bot" ]; then
                  zip -r ../release/bot-linux-v${{ env.VERSION }}.zip bot
              else
                  echo "Error: bot file not found!"
                  exit 1
              fi
            fi
            cd ..
