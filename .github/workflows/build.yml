name: Build on Push (Non-Main Branches)

on:
  push:
    branches-ignore:
      - main  # не запускать на main

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-22.04]  # Параллельная сборка для Windows и Ubuntu

    runs-on: ${{ matrix.os }}  # На каждой платформе из matrix будет выполняться свой job

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      # Сборка для Windows и Linux
      - name: Build Agent and Bot for ${{ matrix.os }}
        run: |
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            # Для Windows создаём .exe файлы
            pyinstaller --onefile --name=agent.exe agent/__main__.py
            pyinstaller --onefile --name=bot.exe bot/__main__.py
          elif [[ "${{ matrix.os }}" == "ubuntu-22.04" ]]; then
            # Для Linux создаём бинарники без .exe
            pyinstaller --onefile --name=agent agent/__main__.py
            pyinstaller --onefile --name=bot bot/__main__.py
          else
            echo "Unknown OS: ${{ matrix.os }}"
            exit 1
          fi

      # Создание архивов
      - name: Create Archives
        run: |
          mkdir release
          cd dist
          # Проверим, что файл существует перед упаковкой
          echo "Listing files in dist/ directory:"
          ls -l

          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            powershell Compress-Archive -Path agent.exe -DestinationPath ../release/agent-windows-v${{ env.VERSION }}.zip
            powershell Compress-Archive -Path bot.exe -DestinationPath ../release/bot-windows-v${{ env.VERSION }}.zip
          else
            # На Linux проверяем, что файлы существуют перед упаковкой
            if [ -f "agent" ]; then
                zip -r ../release/agent-linux-v${{ env.VERSION }}.zip agent
            else
                echo "Error: agent file not found!"
                exit 1
            fi
            
            if [ -f "bot" ]; then
                zip -r ../release/bot-linux-v${{ env.VERSION }}.zip bot
            else
                echo "Error: bot file not found!"
                exit 1
            fi
          fi
          cd ..
