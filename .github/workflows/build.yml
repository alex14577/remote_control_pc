name: Build Linux and Windows

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  ACTIONS_STEP_DEBUG: true

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache virtualenv
        uses: actions/cache@v4
        with:
          path: .venv
          key: linux-venv-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('**/requirements.txt') }}
          restore-keys: linux-venv-

      - name: Install dependencies
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install fpm
        run: |
          sudo apt-get update
          sudo apt-get install ruby-dev -y
          sudo gem install --no-document fpm

      - name: Set version
        run: |
          base_version=$(grep -Po '(?<=version = \")[^\"]*' pyproject.toml)
          VERSION="${base_version}-${GITHUB_RUN_NUMBER}"
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Build executables
        run: |
          .venv/bin/pyinstaller --onefile --name=agent agent/__main__.py
          .venv/bin/pyinstaller --onefile --name=bot bot/__main__.py

      - name: Package Linux
        run: |
          mkdir -p deb_pkg/opt/agent deb_pkg/opt/bot
          cp dist/agent deb_pkg/opt/agent/
          cp agent/config.json deb_pkg/opt/agent/
          cp dist/bot deb_pkg/opt/bot/
          cp bot/config.json deb_pkg/opt/bot/
          mkdir -p deb_pkg/etc/systemd/system
          cp ./etc/systemd/system/agent.service deb_pkg/etc/systemd/system/
          cp ./etc/systemd/system/bot.service deb_pkg/etc/systemd/system/
          fpm -s dir -t deb -n agent -v ${{ env.VERSION }} deb_pkg/opt/agent/ deb_pkg/etc/systemd/system/
          fpm -s dir -t deb -n bot -v ${{ env.VERSION }} deb_pkg/opt/bot/ deb_pkg/etc/systemd/system/
          mkdir -p release
          mv agent_${{ env.VERSION }}_amd64.deb release/
          mv bot_${{ env.VERSION }}_amd64.deb release/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts-linux-${{ env.VERSION }}
          path: release/*

  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache virtualenv
        uses: actions/cache@v4
        with:
          path: .venv
          key: windows-venv-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('**/requirements.txt') }}
          restore-keys: windows-venv-

      - name: Install dependencies
        run: |
          python -m venv .venv
          .\.venv\Scripts\activate
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install NSIS
        run: choco install nsis -y

      - name: Set version
        run: |
          $base_version = (Select-String -Path pyproject.toml -Pattern '(?<=version = \")[^\"]*').Matches.Groups[0].Value
          $full_version = "$base_version-${env:GITHUB_RUN_NUMBER}"
          echo "VERSION=$full_version" >> $Env:GITHUB_ENV

      - name: Build executables
        run: |
          .\.venv\Scripts\pyinstaller.exe --onefile --name=agent agent\__main__.py
          .\.venv\Scripts\pyinstaller.exe --onefile --name=bot bot\__main__.py

      - name: Package Windows
        run: |
          mkdir release
          & "C:\\Program Files (x86)\\NSIS\\makensis.exe" .\installer\agent_installer.nsi /DVERSION=${{ env.VERSION }}
          & "C:\\Program Files (x86)\\NSIS\\makensis.exe" .\installer\bot_installer.nsi /DVERSION=${{ env.VERSION }}
          Move-Item -Path ".\installer\installer-agent-windows-v${{ env.VERSION }}.exe" -Destination ".\release\"
          Move-Item -Path ".\installer\installer-bot-windows-v${{ env.VERSION }}.exe" -Destination ".\release\"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts-windows-${{ env.VERSION }}
          path: release/*

  publish:
    

    if: github.event_name == 'push' && github.event.action == 'closed' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    needs: [build-linux, build-windows]

    steps:
      - name: Print All GitHub Context Variables
        run: |
          echo "GitHub Context Variables: ${{ toJson(github) }}"
          echo "GitHub Context Variables: ${{ toJson(github.event) }}"
          echo "Event Name: $GITHUB_EVENT_NAME"
          echo "Event Action: $GITHUB_EVENT_ACTION"
          echo "Merged: ${{ github.event.pull_request.merged }}"

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set version environment variable
        run: |
          base_version=$(grep -Po '(?<=version = \")[^\"]*' pyproject.toml)
          VERSION="${base_version}-${GITHUB_RUN_NUMBER}"
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts-linux-${{ env.VERSION }}

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts-windows-${{ env.VERSION }}

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/installer-agent-windows-v${{ env.VERSION }}.exe
            release/installer-bot-windows-v${{ env.VERSION }}.exe
            release/agent-${{ env.VERSION }}-amd64.deb
            release/bot-${{ env.VERSION }}-amd64.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install bump2version
        run: python -m pip install --upgrade bump2version

      - name: Set Git identity
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      - name: Bump version
        run: |
          bump2version patch --allow-dirty
          git add pyproject.toml
          git commit -m "Bump version [skip ci]"
          git tag v$(grep -Po '(?<=version = \")[^\"]*' pyproject.toml)
          git push origin main --tags
