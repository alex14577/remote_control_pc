name: CI Pipeline

on:
  push:
    branches:
      - main  # Запускать на пуш в main
  pull_request:
    branches:
      - main  # Запускать при создании Pull Request в main

jobs:
  # Сборка для Windows и Linux
  build:
    runs-on: ${{ matrix.os }}  # Параллельно для Windows и Linux
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]  # Параллельная сборка для Windows и Linux

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install bump2version
          pip install -r requirements.txt

      - name: Build and package for ${{ matrix.os }}
        run: |
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            # Для Windows создаём .exe файлы
            pyinstaller --onefile --name=agent.exe agent/__main__.py
            pyinstaller --onefile --name=bot.exe bot/__main__.py
            powershell Compress-Archive -Path agent.exe -DestinationPath ./release/agent-windows-v${{ env.VERSION }}.zip
            powershell Compress-Archive -Path bot.exe -DestinationPath ./release/bot-windows-v${{ env.VERSION }}.zip
            echo "Windows build and release complete."
          elif [[ "${{ matrix.os }}" == "ubuntu-latest" ]]; then
            # Для Linux создаём бинарники без .exe
            pyinstaller --onefile --name=agent agent/__main__.py
            pyinstaller --onefile --name=bot bot/__main__.py
            zip -r ./release/agent-linux-v${{ env.VERSION }}.zip agent
            zip -r ./release/bot-linux-v${{ env.VERSION }}.zip bot
            echo "Linux build and release complete."
          fi

  # Публикация релиза только при слиянии PR в main
  publish_release:
    runs-on: ubuntu-latest
    needs: build  # Этот шаг будет выполнен только после успешных сборок для обеих платформ
    if: github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Bump version
        run: |
          echo "Bumping version..."
          bump2version patch --allow-dirty
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add pyproject.toml
          git commit -m "Bump version [skip ci]"
          git tag v$(grep -Po '(?<=version = ")[^"]*' pyproject.toml)
          git push origin main --tags

      - name: Publish Release on GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/agent-windows-v${{ env.VERSION }}.zip
            release/bot-windows-v${{ env.VERSION }}.zip
            release/agent-linux-v${{ env.VERSION }}.zip
            release/bot-linux-v${{ env.VERSION }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
