name: CI Pipeline

on:
  push:
    branches:
      - main  # Запускать на пуш в main
  pull_request:
    branches:
      - main  # Запускать при создании Pull Request в main

jobs:
  # Сборка для Windows и Linux
  build:
    runs-on: ${{ matrix.os }}  # Параллельная сборка для Windows и Linux
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]  # Параллельная сборка для Windows и Linux

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install bump2version
          pip install -r requirements.txt
        
      - name: Install fpm
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install ruby-dev  # Устанавливаем зависимости для fpm
          sudo gem install --no-document fpm  # Устанавливаем fpm
          echo "fpm installed"

      # Сборка для Windows
      - name: Build and package for Windows
        if: runner.os == 'Windows'  # Условие для Windows
        run: |
          pyinstaller --onefile --name=agent.exe agent/__main__.py
          pyinstaller --onefile --name=bot.exe bot/__main__.py
          
          # Установщик Windows с помощью NSIS для агента
          echo "!include 'MUI2.nsh'" > agent_installer.nsi
          echo "Outfile 'installer-agent-windows-v${{ env.VERSION }}.exe'" >> agent_installer.nsi
          echo "InstallDir \$TEMP" >> agent_installer.nsi
          echo "Section" >> agent_installer.nsi
          echo "  SetOutPath \$INSTDIR" >> agent_installer.nsi
          echo "  File dist\\agent.exe" >> agent_installer.nsi
          echo "  File agent\\config.json" >> agent_installer.nsi  # Добавляем config.json
          echo "  WriteRegStr HKLM 'SOFTWARE\\Agent' 'Path' '\$INSTDIR\\agent.exe'" >> agent_installer.nsi
          echo "  ExecWait '\$INSTDIR\\agent.exe --config \$INSTDIR\\config.json'" >> agent_installer.nsi  # Запуск с аргументом
          echo "SectionEnd" >> agent_installer.nsi
          
          # Установщик Windows с помощью NSIS для бота
          echo "!include 'MUI2.nsh'" > bot_installer.nsi
          echo "Outfile 'installer-bot-windows-v${{ env.VERSION }}.exe'" >> bot_installer.nsi
          echo "InstallDir \$TEMP" >> bot_installer.nsi
          echo "Section" >> bot_installer.nsi
          echo "  SetOutPath \$INSTDIR" >> bot_installer.nsi
          echo "  File dist\\bot.exe" >> bot_installer.nsi
          echo "  File bot\\config.json" >> bot_installer.nsi  # Добавляем config.json
          echo "  WriteRegStr HKLM 'SOFTWARE\\Bot' 'Path' '\$INSTDIR\\bot.exe'" >> bot_installer.nsi
          echo "  ExecWait '\$INSTDIR\\bot.exe --config \$INSTDIR\\config.json'" >> bot_installer.nsi  # Запуск с аргументом
          echo "SectionEnd" >> bot_installer.nsi
          
          # Сборка установщиков с помощью NSIS
          C:\\Program Files (x86)\\NSIS\\makensis.exe agent_installer.nsi
          C:\\Program Files (x86)\\NSIS\\makensis.exe bot_installer.nsi

          # Перемещаем установщики в папку release
          move /Y installer-agent-windows-v${{ env.VERSION }}.exe ./release/
          move /Y installer-bot-windows-v${{ env.VERSION }}.exe ./release/
          echo "Windows build and release complete."

      - name: Build and package for Linux
        if: runner.os == 'Linux'  # Условие для Linux
          run: |
            echo "Starting the build process for Linux"
        
            # Для Linux создаём бинарники без .exe
            echo "Running pyinstaller for agent"
            pyinstaller --onefile --name=agent agent/__main__.py
            echo "Running pyinstaller for bot"
            pyinstaller --onefile --name=bot bot/__main__.py
            
            # Создаём директории, если их нет
            echo "Creating directories for packaging"
            mkdir -p deb_pkg/opt/agent
            mkdir -p deb_pkg/opt/bot
        
            # Проверяем, что файлы были созданы, и копируем их
            echo "Checking if dist/agent exists"
            if [ ! -f "dist/agent" ]; then
              echo "Error: dist/agent not found!"
              exit 1
            else
              echo "dist/agent exists"
            fi
        
            echo "Checking if dist/bot exists"
            if [ ! -f "dist/bot" ]; then
              echo "Error: dist/bot not found!"
              exit 1
            else
              echo "dist/bot exists"
            fi
        
            echo "Copying files to deb_pkg/opt/agent/"
            cp dist/agent deb_pkg/opt/agent/    # Копируем бинарник агента
            cp agent/config.json deb_pkg/opt/agent/  # Копируем конфигурационный файл агента
        
            echo "Copying files to deb_pkg/opt/bot/"
            cp dist/bot deb_pkg/opt/bot/    # Копируем бинарник бота
            cp bot/config.json deb_pkg/opt/bot/  # Копируем конфигурационный файл бота
        
            # Проверяем содержимое директории перед упаковкой
            echo "Listing contents of deb_pkg/opt/agent"
            ls -R deb_pkg/opt/agent/
        
            echo "Listing contents of deb_pkg/opt/bot"
            ls -R deb_pkg/opt/bot/
        
            echo "Adding systemd services"
            # Добавляем systemd сервисы для Linux
            mkdir -p deb_pkg/etc/systemd/system
            cp ./etc/systemd/system/agent.service deb_pkg/etc/systemd/system/
            cp ./etc/systemd/system/bot.service deb_pkg/etc/systemd/system/
        
            echo "Listing contents of deb_pkg/etc/systemd/system"
            ls -R deb_pkg/etc/systemd/system/
        
            # Проверяем, что все файлы на месте
            echo "Building the .deb packages using fpm"
            fpm -s dir -t deb -n agent -v ${{ env.VERSION }} --prefix /opt/agent deb_pkg/opt/agent/ deb_pkg/etc/systemd/system/
            fpm -s dir -t deb -n bot -v ${{ env.VERSION }} --prefix /opt/bot deb_pkg/opt/bot/ deb_pkg/etc/systemd/system/
        
            # Перемещаем .deb файлы в release
            echo "Moving .deb files to release"
            mv agent-${{ env.VERSION }}-1_amd64.deb ./release/
            mv bot-${{ env.VERSION }}-1_amd64.deb ./release/
        
            echo "Linux build and release complete."
        

  # Публикация релиза только при слиянии PR в main
  publish_release:
    runs-on: ubuntu-latest
    needs: build  # Этот шаг будет выполнен только после успешных сборок для обеих платформ
    if: github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Bump version
        run: |
          echo "Bumping version..."
          bump2version patch --allow-dirty
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add pyproject.toml
          git commit -m "Bump version [skip ci]"
          git tag v$(grep -Po '(?<=version = ")[^"]*' pyproject.toml)
          git push origin main --tags

      - name: Publish Release on GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/installer-agent-windows-v${{ env.VERSION }}.exe
            release/installer-bot-windows-v${{ env.VERSION }}.exe
            release/agent-${{ env.VERSION }}-1_amd64.deb
            release/bot-${{ env.VERSION }}-1_amd64.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
