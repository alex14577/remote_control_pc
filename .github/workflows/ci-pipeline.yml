name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    if: github.event_name != 'pull_request' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install fpm (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install ruby-dev -y
          sudo gem install --no-document fpm

      - name: Install NSIS (Windows only)
        if: runner.os == 'Windows'
        run: choco install nsis -y

      - name: Set version environment variable (Windows)
        if: runner.os == 'Windows'
        run: |
          $base_version = (Select-String -Path pyproject.toml -Pattern '(?<=version = \")[^\"]*').Matches.Groups[0].Value
          if (!$base_version) { Write-Error "Version not found!"; exit 1 }
          $full_version = "$base_version.${env:GITHUB_RUN_NUMBER}"
          echo "VERSION=$full_version" >> $Env:GITHUB_ENV
      
      - name: Set version environment variable (Linux)
        if: runner.os == 'Linux'
        run: |
          base_version=$(grep -Po '(?<=version = \")[^\"]*' pyproject.toml)
          if [ -z "$base_version" ]; then echo "Version not found!"; exit 1; fi
          VERSION="${base_version}.${GITHUB_RUN_NUMBER}"
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Build executables
        run: |
          pyinstaller --onefile --name=agent agent/__main__.py
          pyinstaller --onefile --name=bot bot/__main__.py

      - name: Build and package for Windows
        if: runner.os == 'Windows'
        run: |
          mkdir release
          & "C:\\Program Files (x86)\\NSIS\\makensis.exe" .\installer\agent_installer.nsi /DVERSION=${{ env.VERSION }}
          & "C:\\Program Files (x86)\\NSIS\\makensis.exe" .\installer\bot_installer.nsi /DVERSION=${{ env.VERSION }}

          Get-ChildItem -Recurse 
          Move-Item -Path ".\installer\installer-agent-windows-v${{ env.VERSION }}.exe" -Destination ".\release\"
          Move-Item -Path ".\installer\installer-bot-windows-v${{ env.VERSION }}.exe" -Destination ".\release\"

      - name: Build and package for Linux
        if: runner.os == 'Linux'
        run: |
          mkdir -p deb_pkg/opt/agent deb_pkg/opt/bot

          cp dist/agent deb_pkg/opt/agent/
          cp agent/config.json deb_pkg/opt/agent/
          cp dist/bot deb_pkg/opt/bot/
          cp bot/config.json deb_pkg/opt/bot/

          mkdir -p deb_pkg/etc/systemd/system
          cp ./etc/systemd/system/agent.service deb_pkg/etc/systemd/system/
          cp ./etc/systemd/system/bot.service deb_pkg/etc/systemd/system/

          fpm -s dir -t deb -n agent -v ${{ env.VERSION }} deb_pkg/opt/agent/ deb_pkg/etc/systemd/system/
          fpm -s dir -t deb -n bot -v ${{ env.VERSION }} deb_pkg/opt/bot/ deb_pkg/etc/systemd/system/

          mkdir -p release
          mv agent_${{ env.VERSION }}_amd64.deb release/
          mv bot_${{ env.VERSION }}_amd64.deb release/
          
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts-${{ matrix.os }}
          path: release/*

  publish_release:
    runs-on: ubuntu-latest
    needs: build
    if: |
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main')
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts-${{ matrix.os }}
          path: release

      - name: Bump version
        run: |
          python -m pip install --upgrade bump2version
          bump2version patch --allow-dirty
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add pyproject.toml
          git commit -m "Bump version [skip ci]"
          git tag v$(grep -Po '(?<=version = \")[^\"]*' pyproject.toml)
          git push origin main --tags

      - name: Publish Release on GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/installer-agent-windows-v${{ env.VERSION }}.exe
            release/installer-bot-windows-v${{ env.VERSION }}.exe
            release/agent-${{ env.VERSION }}-1_amd64.deb
            release/bot-${{ env.VERSION }}-1_amd64.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


