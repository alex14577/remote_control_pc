name: Publish Release

on:
  workflow_run:
    workflows: ["Build Linux", "Build Windows"]
    types:
      - completed

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          path: release

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          path: release

      - name: Install bump2version
        run: python -m pip install --upgrade bump2version

      - name: Set Git identity
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      - name: Bump version
        run: |
          bump2version patch --allow-dirty
          git add pyproject.toml
          git commit -m "Bump version [skip ci]"
          git tag v$(grep -Po '(?<=version = \")[^\"]*' pyproject.toml)
          git push origin main --tags

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*
            release/installer-bot-windows-v*.exe
            release/agent-*_amd64.deb
            release/bot-*_amd64.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
