name: Publish Release

on:
  workflow_run:
    workflows: ["Build Linux and Windows"]
    types:
      - completed  # Triggered when the "Build Linux and Windows" workflow is completed.

jobs:
  publish:
    runs-on: ubuntu-latest
    needs: [build-linux, build-windows]  # Wait for the build jobs to finish

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Get Pull Request Info
        id: pr_info
        run: |
          PR_NUMBER=$(curl -s https://api.github.com/repos/${{ github.repository }}/pulls?state=closed | jq -r '.[0].number')
          PR_MERGED=$(curl -s https://api.github.com/repos/${{ github.repository }}/pulls/${PR_NUMBER} | jq -r '.merged')
          echo "Pull request number: $PR_NUMBER"
          echo "Merged status: $PR_MERGED"
          echo "MERGED=$PR_MERGED" >> $GITHUB_ENV

      - name: Check if PR was merged
        if: env.MERGED == 'true'  # Only continue if the PR was merged
        run: |
          echo "The pull request was merged. Continuing with the publish steps."

      - name: Set version environment variable
        run: |
          base_version=$(grep -Po '(?<=version = \")[^\"]*' pyproject.toml)
          VERSION="${base_version}-${GITHUB_RUN_NUMBER}"
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Download Linux artifacts
        uses: actions/download-artifact@v2
        with:
          name: build-artifacts-linux-${{ github.sha }}

      - name: Download Windows artifacts
        uses: actions/download-artifact@v2
        with:
          name: build-artifacts-windows-${{ github.sha }}

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/installer-agent-windows-v${{ env.VERSION }}.exe
            release/installer-bot-windows-v${{ env.VERSION }}.exe
            release/agent-${{ env.VERSION }}-amd64.deb
            release/bot-${{ env.VERSION }}-amd64.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install bump2version
        run: python -m pip install --upgrade bump2version

      - name: Set Git identity
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      - name: Bump version
        run: |
          bump2version patch --allow-dirty
          git add pyproject.toml
          git commit -m "Bump version [skip ci]"
          git tag v$(grep -Po '(?<=version = \")[^\"]*' pyproject.toml)
          git push origin main --tags
