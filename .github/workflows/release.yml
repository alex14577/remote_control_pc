name: Release on Push to Main

on:
  push:
    branches:
      - main

jobs:
  bump_version:
    runs-on: ubuntu-latest  # Шаг с увеличением версии выполняется только один раз на любой платформе

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install bump2version
          pip install -r requirements.txt

      - name: Bump version
        run: |
          bump2version patch --allow-dirty
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add pyproject.toml
          git commit -m "Bump version [skip ci]"
          git tag v$(grep -Po '(?<=version = ")[^"]*' pyproject.toml)
          git push origin main --tags

  release:
    needs: bump_version  # Ожидаем завершения шага увеличения версии

    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [windows-latest, ubuntu-22.04]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Build Agent and Bot for ${{ matrix.os }}
        run: |
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            pyinstaller --onefile --name=agent.exe agent/__main__.py
            pyinstaller --onefile --name=bot.exe bot/__main__.py
          else
            pyinstaller --onefile --name=agent agent/__main__.py
            pyinstaller --onefile --name=bot bot/__main__.py

      - name: Create Archives
        run: |
          mkdir release
          cd dist
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            powershell Compress-Archive -Path agent.exe -DestinationPath ../release/agent-windows-v${{ env.VERSION }}.zip
            powershell Compress-Archive -Path bot.exe -DestinationPath ../release/bot-windows-v${{ env.VERSION }}.zip
          else
            zip -r ../release/agent-linux-v${{ env.VERSION }}.zip agent
            zip -r ../release/bot-linux-v${{ env.VERSION }}.zip bot
          fi
          cd ..

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/agent-windows-v${{ env.VERSION }}.zip
            release/bot-windows-v${{ env.VERSION }}.zip
            release/agent-linux-v${{ env.VERSION }}.zip
            release/bot-linux-v${{ env.VERSION }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
