name: Build and Release Agent and Bot (RAR)

on:
  push:
    tags:
      - 'v*'    # Срабатывает на пуш тега v1.0.0

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Build Agent
        run: |
          pyinstaller --onefile --name=agent.exe agent/__main__.py

      - name: Build Bot
        run: |
          pyinstaller --onefile --name=bot.exe bot/__main__.py

      - name: Download rar.exe
        run: |
          Invoke-WebRequest -Uri "https://www.rarlab.com/rar/rarx64.exe" -OutFile "rar.exe"

      - name: Create RAR archives
        run: |
          mkdir release
          cd dist
          ../rar.exe a ../release/agent.rar agent.exe
          ../rar.exe a ../release/bot.rar bot.exe
          cd ..

      - name: Upload Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.rar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
